[project]
name = "python-for-ai"
version = "0.1.0"
description = "Python for GenAI engineering: Pydantic, async, LLM apps. Daily learning log."
readme = "README.md"
authors = [
    { name = "sijo varghese", email = "sijovarghese1604@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.scripts]
python-for-ai = "python_for_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
